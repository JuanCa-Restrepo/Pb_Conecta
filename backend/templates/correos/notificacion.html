<!doctype html>
<html lang="es">
<body style="margin:0;padding:24px;background:#f3f5f9;font-family:Arial,Helvetica,sans-serif;color:#1d2433;">
  <table role="presentation" width="100%" style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:8px;overflow:hidden;">
    <tr>
      <td style="background:#0b3b7a;color:#ffffff;padding:20px 24px;font-size:20px;font-weight:bold;">PB Conecta</td>
    </tr>
    <tr>
      <td style="padding:24px;">
        <p style="margin:0 0 12px;">Hola {{ nombre }},</p>
        <h2 style="margin:0 0 12px;font-size:18px;color:#0b3b7a;">{{ titulo }}</h2>
        <p style="margin:0 0 20px;line-height:1.5;">{{ mensaje }}</p>
        <a href="{{ enlace }}" style="display:inline-block;background:#0b3b7a;color:#ffffff;text-decoration:none;padding:10px 18px;border-radius:6px;">Abrir PB Conecta</a>
      </td>
    </tr>
    <tr>
      <td style="padding:16px 24px;font-size:12px;color:#6b7385;border-top:1px solid #e5e8ef;">
        Institución Universitaria Pascual Bravo · Oficina de prácticas
      </td>
    </tr>
  </table>
</body>
</html>
