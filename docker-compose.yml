# PB Conecta — entorno de desarrollo
# Uso: docker compose up --build
# Entrada única: http://localhost:8080  ·  Correos: http://localhost:8025

name: pbconecta

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"   # Para inspeccionar con DBeaver/pgAdmin (puerto 5433 del equipo)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"   # Bandeja web de correos de prueba

  backend:
    build: ./backend
    env_file: .env
    environment:
      EJECUTAR_MIGRACIONES: "1"
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
      - media:/app/media
      - static:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  scheduler:
    build: ./backend
    env_file: .env
    command: python manage.py ejecutar_scheduler
    volumes:
      - ./backend:/app
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      target: desarrollo
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/desarrollo.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/srv/media:ro
      - static:/srv/static:ro
    depends_on:
      - backend
      - frontend

volumes:
  pg_data:
  media:
  static:
  frontend_node_modules:
