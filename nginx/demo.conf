upstream backend { server backend:8000; }

server {
    listen 80;
    # Redirecciones relativas: sin esto, /admin -> /admin/ perdería el puerto 8080 del equipo
    absolute_redirect off;
    client_max_body_size 10M;
    root /usr/share/nginx/html;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/   { proxy_pass http://backend; }
    location /admin/ { proxy_pass http://backend; }

    location /static/        { alias /srv/static/; }
    location /media/publico/ { alias /srv/media/publico/; }

    location /protegido/ {
        internal;
        alias /srv/media/protegido/;
    }

    # SPA: cualquier ruta del frontend devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
