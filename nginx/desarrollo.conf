upstream backend  { server backend:8000; }
upstream frontend { server frontend:5173; }

server {
    listen 80;
    # Redirecciones relativas: sin esto, /admin -> /admin/ perdería el puerto 8080 del equipo
    absolute_redirect off;
    client_max_body_size 10M;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # API, admin de Django y sus archivos estáticos
    location /api/    { proxy_pass http://backend; }
    location /admin/  { proxy_pass http://backend; }
    location /static/ { proxy_pass http://backend; }

    # Archivos públicos (logos, fotos, imágenes del muro)
    location /media/publico/ { alias /srv/media/publico/; }

    # Archivos protegidos: solo se entregan si Django responde con X-Accel-Redirect
    location /protegido/ {
        internal;
        alias /srv/media/protegido/;
    }

    # Frontend con Vite (incluye el websocket de recarga en caliente).
    # Al definir proxy_set_header aquí se pierden los del bloque server, por eso se repite Host.
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
